# /opt/desktop/wechat.conf —— 微信专用合成器配置（desktop 用它替代 cage）
# 为什么不用 cage：cage 0.2 是 kiosk，view 的 lx/ly 写死 0，窗口只能贴左上角，
# 没有配置项也没有 IPC 能改布局 —— 居中在 cage 上做不到。
# 这里三件事：
#   1) 背景铺桌面同一张壁纸（wallpaper.bgra 由 tools/bgra2png.py 转出的 PNG）
#   2) 微信 map 之后由 bin/wx-center.py 补 resize+move（Electron 会覆盖 map 时的尺寸）
#   3) 微信退出 → sway 退出 → 回桌面
# 不要写死 mode：123 的 BenQ 原生 2560x1440，121 的 Sony 电视原生 3840x2160，
# 写 mode 2560x1440 在电视上不被接受（sway 只警告，落回 preferred），居中靠
# wx-center.py 现读 output rect 算，所以这里给 preferred 模式两边都对。
output HDMI-A-1 position 0 0 bg /opt/desktop/assets/wallpaper.png fill
default_border none
hide_edge_borders both
xwayland disable
bar { mode invisible }
seat seat0 hide_cursor 1
focus_follows_mouse no
for_window [app_id=".*"] floating enable
exec /opt/desktop/bin/wx-center.py
exec sh -c '/opt/wechat/wechat --no-sandbox --ozone-platform=wayland --disable-dev-shm-usage --window-size=1280,720; swaymsg exit'
