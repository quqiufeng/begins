# 桌面是常驻底座：崩了自己起来，起不来的原因（等 NAS / HDMI 重新锁信号）要给够时间，
# 也不要让 5 次/10s 的上限把服务永久打成 failed。
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=2
# 原来 TimeoutStartUSec=10s，而 ExecStartPre=wait-nas 40s：NAS 不在时
# wait-nas 每轮 2s 超时，第 10 秒就被 systemd 砍掉，永远走不到"等不到也放行"。
TimeoutStartSec=150
TimeoutStopSec=20
