# 遥控派发（keybd）是输入底座：和桌面一样必须常驻。
# 它不占 KMS、没有 wait-nas，启动本身很快，所以只补三处：
#  1) StartLimitIntervalSec=0 —— 遥控器按坏/设备重连导致连续失败时，
#     不能让 5 次/10s 的上限把它永久打成 failed（那是「遥控彻底没反应」）；
#  2) Restart 显式写死（原来就有，写在这里是为了单元被覆盖后语义不丢）；
#  3) TimeoutStopSec 放宽 —— GRAB=1 时它握着一堆 event* 的独占 fd，
#     停的时候要来得及 EVIOCGRAB(0) 放掉，否则下一任收不到键。
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=2
TimeoutStartSec=20
TimeoutStopSec=20
