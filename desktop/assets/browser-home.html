<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首页</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 56px 72px;
    font-family: "Noto Sans CJK SC", "Noto Sans SC", system-ui, sans-serif;
    background: #fbfaf7; color: #22201d;
    outline: none;
  }
  h1 { font-size: 44px; font-weight: 600; margin: 0 0 6px; letter-spacing: .02em; }
  .sub { font-size: 20px; color: #8a8279; margin-bottom: 48px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  a.card {
    display: block; padding: 26px 24px; border-radius: 14px;
    background: #fff; border: 2px solid #e6e1d8;
    text-decoration: none; color: inherit; outline: none;
    transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
  }
  a.card:hover, a.card:focus { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.08); border-color: #c9c0b2; }
  /* 遥控焦点：比 hover 更硬，隔两米也要一眼看见 */
  a.card:focus { border-color: #c2410c; box-shadow: 0 0 0 4px rgba(194,65,12,.18), 0 10px 28px rgba(0,0,0,.10); }
  .t { font-size: 26px; font-weight: 600; margin-bottom: 6px; }
  .d { font-size: 16px; color: #8a8279; }
  a.card:focus .t { color: #c2410c; }
  .key { display: inline-block; margin-top: 44px; font-size: 17px; color: #a0968a; }
  kbd {
    font: inherit; font-size: 15px; padding: 2px 8px; border-radius: 6px;
    background: #efeae0; border: 1px solid #ddd5c7; color: #5d564d;
  }
  #toast {
    position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%) translateY(12px);
    padding: 14px 26px; border-radius: 12px; font-size: 20px;
    background: #22201d; color: #fbfaf7; opacity: 0; pointer-events: none;
    transition: opacity .15s ease, transform .15s ease;
  }
  #toast.on { opacity: .92; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>首页</h1>
  <div class="sub">方向键移动 · <kbd>OK</kbd> 打开 · <kbd>返回</kbd> 回上一页，在首页再按返回就退出</div>

  <div class="grid">
    <a class="card" href="https://www.bing.com"><div class="t">必应</div><div class="d">bing.com</div></a>
    <a class="card" href="https://www.bilibili.com"><div class="t">哔哩哔哩</div><div class="d">bilibili.com</div></a>
    <a class="card" href="https://github.com"><div class="t">GitHub</div><div class="d">github.com</div></a>
    <a class="card" href="https://www.zhihu.com"><div class="t">知乎</div><div class="d">zhihu.com</div></a>
    <a class="card" href="https://www.youtube.com"><div class="t">YouTube</div><div class="d">youtube.com</div></a>
    <a class="card" href="https://music.163.com"><div class="t">网易云音乐</div><div class="d">music.163.com</div></a>
    <a class="card" href="https://www.douban.com"><div class="t">豆瓣</div><div class="d">douban.com</div></a>
    <a class="card" href="https://news.ycombinator.com"><div class="t">Hacker News</div><div class="d">news.ycombinator.com</div></a>
  </div>

  <div class="key">地址栏：<kbd>Ctrl</kbd>+<kbd>L</kbd>（需接键盘）</div>
  <div id="toast"></div>

<script>
(function () {
  var cards = function () { return Array.prototype.slice.call(document.querySelectorAll('a.card')); };
  var idx = 0;
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('on'); }, ms || 2200);
  }

  // 列数按实际排版算：第一行有几张卡就是几列（窗口/缩放变化都不用改代码）
  function columns() {
    var cs = cards();
    if (!cs.length) return 4;
    var top = cs[0].offsetTop, n = 0;
    for (var i = 0; i < cs.length; i++) if (cs[i].offsetTop === top) n++;
    return n > 0 ? n : 4;
  }

  function focusCard(i, scroll) {
    var cs = cards();
    if (!cs.length) return;
    idx = Math.max(0, Math.min(cs.length - 1, i));
    try { cs[idx].focus({ preventScroll: true }); } catch (e) { cs[idx].focus(); }
    try { localStorage.setItem('home.idx', String(idx)); } catch (e) {}
    if (scroll !== false && cs[idx].scrollIntoView) {
      try { cs[idx].scrollIntoView({ block: 'nearest' }); } catch (e) { cs[idx].scrollIntoView(); }
    }
    document.title = '首页 - ' + (cs[idx].querySelector('.t') || {}).textContent;
  }

  // 首次进页面就把焦点放在上次看的那张（没有就第一张）：
  // 焦点不落地时方向键只会滚页面，用户的感觉就是"方向键没反应"
  function init() {
    var saved = 0;
    try { saved = parseInt(localStorage.getItem('home.idx') || '0', 10) || 0; } catch (e) {}
    focusCard(saved);
    document.body.focus();
    window.focus();
  }

  // 一次按下只算一次：按住不放的自动重复、以及遥控器同一键被两个接口各报一遍
  // （keybd 直通 + 原设备）都会被这里挡掉，保证"按一下移动一格"。
  // 窗口必须大于 keybd 的 REPEAT_MS(220)：直通进来的重复事件不带 repeat 标志，
  // 60ms 的窗口挡不住，一次按键会连跳两格。
  var lastKeyCode = 0, lastKeyAt = 0, DEDUP_MS = 260;
  document.addEventListener('keydown', function (e) {
    var now = Date.now();
    if (e.repeat) return;
    // 同一键的连发不管什么来源，一律按 DEDUP_MS 挡；不同键互不影响
    if (e.keyCode === lastKeyCode && now - lastKeyAt < DEDUP_MS) return;
    lastKeyCode = e.keyCode; lastKeyAt = now;
    var cs = cards();
    if (!cs.length) return;
    var k = e.key, handled = true;
    var cols = columns();

    if (k === 'ArrowRight' || k === 'Right' || e.keyCode === 39) {
      focusCard(idx + 1);
    } else if (k === 'ArrowLeft' || k === 'Left' || e.keyCode === 37) {
      focusCard(idx - 1);
    } else if (k === 'ArrowDown' || k === 'Down' || e.keyCode === 40) {
      // 已经在最后一行就待在原地，别让焦点跑掉
      focusCard(Math.min(idx + cols, cs.length - 1));
    } else if (k === 'ArrowUp' || k === 'Up' || e.keyCode === 38) {
      focusCard(idx - cols >= 0 ? idx - cols : idx);
    } else if (k === 'Enter' || k === 'OK' || e.keyCode === 13) {
      var cur = cs[idx] || cs[0];
      cur.click();
    } else if (k === ' ' || k === 'Spacebar') {
      var c2 = cs[idx] || cs[0];
      c2.click();
    } else if (k === 'Home') {
      focusCard(0);
    } else if (k === 'End') {
      focusCard(cs.length - 1);
    } else if (k === 'Escape' || k === 'GoBack' || k === 'Back' || k === 'BrowserBack' || e.keyCode === 27) {
      if (history.length > 1) { history.back(); }
      else { toast('再按一次「返回」退出浏览器'); }
    } else if (k === 'Backspace') {
      if (history.length > 1) { history.back(); }
      else { toast('已在首页'); }
    } else {
      handled = false;
    }

    if (handled) { e.preventDefault(); e.stopPropagation(); }
  });

  // 鼠标点过之后焦点别丢在 body 上
  document.addEventListener('mousedown', function () { setTimeout(function () { focusCard(idx, false); }, 0); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
  window.addEventListener('load', init);
})();
</script>
</body>
</html>
