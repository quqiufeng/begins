<!doctype html><meta charset=utf-8>
<body style="margin:0;background:#000">
<canvas id=c></canvas>
<div id=o style="position:fixed;left:40px;top:40px;color:#0f0;font:64px monospace;z-index:9"></div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d');
function fit(){c.width=innerWidth;c.height=innerHeight;}
fit();addEventListener('resize',fit);
var n=0,t0=performance.now(),last=t0,worst=0;
function loop(t){
 n++;var d=t-last;last=t;if(d>worst)worst=d;
 var el=t-t0;
 if(el>500){var fps=n*1000/el;
  o.textContent='FPS '+fps.toFixed(1)+'\nW '+innerWidth+'x'+innerHeight+'\ndpr '+devicePixelRatio+'\nworst '+worst.toFixed(0)+'ms';
  n=0;t0=t;worst=0;}
 for(var i=0;i<40;i++){x.fillStyle='hsl('+((t/8+i*9)%360)+',90%,55%)';x.fillRect(Math.random()*c.width,Math.random()*c.height,120,120);}
 x.fillStyle='rgba(0,0,0,.25)';x.fillRect(0,0,c.width,c.height);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
