# X96 Max (S905X2) source rootfs build
# Reproducible minimal wired-only image for the X96 Max.
BOARD=odroidn2
BRANCH=current
RELEASE=trixie
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
EXPERT=yes
PREFER_DOCKER=no
ARTIFACT_IGNORE_CACHE=yes

# Applied during rootfs creation by distro-agnostic.sh.
PACKAGE_LIST_FAMILY_REMOVE="alsa-utils bash-completion bc console-setup console-setup-linux kbd keyboard-configuration xkb-data cron cron-daemon-common debsums dialog figlet toilet toilet-fonts groff-base man-db htop iw wpasupplicant wireless-regdb jq lsof mtd-utils pahole rsyslog usbutils wireguard-tools gpiod mmc-utils nano less curl wget rsync logrotate fake-hwclock perl perl-modules-5.40 locales apt-utils debconf-utils dmsetup"
